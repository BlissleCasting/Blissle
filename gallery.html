  <title>Gallery | Blissle</title>
  <link rel="stylesheet" href="common.css">
  <style>
    /* Page-specific styles */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }

    .gallery-item {
      background-color: white;
      padding: 15px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      border-radius: 8px;
    }

    .gallery-item img,
    .gallery-item video {
      width: 100%;
      height: auto;
      border-radius: 8px;
    }

    .portrait-grid, .landscape-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }

    .portrait-grid img, .landscape-grid img {
      width: 100%;
      height: auto;
      max-height: 300px;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      transition: transform 0.2s ease-in-out;
      background: #fff;
      padding: 5px;
    }

    .portrait-grid img:hover, .landscape-grid img:hover {
      transform: scale(1.05);
    }

    .upload-section {
      margin-top: 30px;
      padding: 20px;
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.05);
    }

    .upload-section input {
      margin-top: 10px;
    }
  </style>
</head>
